[project]
name = "obs-mcp"
version = "0.1.0"
description = "只读 S3 兼容华为 OBS 查询 MCP"
requires-python = ">=3.12"
dependencies = ["boto3>=1.34,<2.0", "mcp>=1.0,<2.0", "PyYAML>=6.0,<7.0"]

[project.optional-dependencies]
test = ["pytest>=8.0,<10.0"]
build = ["pyinstaller>=6.0,<7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["obs_mcp*"]
