name: Build MCP executables

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.project }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: k8s-mcp
            runner: windows-latest
            platform: windows-x64
          - project: k8s-mcp
            runner: macos-13
            platform: macos-x64
          - project: k8s-mcp
            runner: macos-14
            platform: macos-arm64
          - project: loki-mcp
            runner: windows-latest
            platform: windows-x64
          - project: loki-mcp
            runner: macos-13
            platform: macos-x64
          - project: loki-mcp
            runner: macos-14
            platform: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,build]"

      - name: Run tests
        working-directory: ${{ matrix.project }}
        run: python -m pytest -v

      - name: Build executable
        working-directory: ${{ matrix.project }}
        run: python -m PyInstaller --noconfirm --clean --onefile --name ${{ matrix.project }} --paths . main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-${{ matrix.platform }}
          path: ${{ matrix.project }}/dist/*
          if-no-files-found: error
