services:
  db-mcp:
    container_name: db-mcp
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: db-mcp:latest
    restart: unless-stopped
    ports:
      - "${DB_MCP_BIND_ADDRESS:-0.0.0.0}:18000:18000"
    volumes:
      - ../config/env.yaml:/etc/db-mcp/env.yaml:ro
    command:
      - --config-file
      - /etc/db-mcp/env.yaml
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "18000"
      - --allowed-host
      - ${DB_MCP_ALLOWED_HOST:?请在 .env 中设置 DB_MCP_ALLOWED_HOST}
