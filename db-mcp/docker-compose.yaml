services:
  db-mcp:
    build:
      context: .
    image: db-mcp:latest
    restart: unless-stopped
    ports:
      - "${DB_MCP_BIND_ADDRESS:-0.0.0.0}:8000:8000"
    volumes:
      - ./config/env.yaml:/etc/db-mcp/env.yaml:ro
    command:
      - --config-file
      - /etc/db-mcp/env.yaml
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --allowed-host
      - ${DB_MCP_ALLOWED_HOST:?请在 .env 中设置 DB_MCP_ALLOWED_HOST}
