services:
  k8s-mcp:
    container_name: k8s-mcp
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: k8s-mcp:latest
    restart: unless-stopped
    ports:
      - "${K8S_MCP_BIND_ADDRESS:-0.0.0.0}:18002:18002"
    volumes:
      - ../config:/etc/k8s-mcp:ro
    command:
      - --transport
      - streamable-http
      - --env-file
      - /etc/k8s-mcp/env.yaml
      - --kubeconfig-dir
      - /etc/k8s-mcp
      - --host
      - 0.0.0.0
      - --port
      - "18002"
      - --allowed-host
      - ${K8S_MCP_ALLOWED_HOST:?请在 .env 中设置 K8S_MCP_ALLOWED_HOST}
