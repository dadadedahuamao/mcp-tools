services:
  redis-mcp:
    container_name: redis-mcp
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: redis-mcp:latest
    restart: unless-stopped
    ports:
      - "${REDIS_MCP_BIND_ADDRESS:-0.0.0.0}:18003:18003"
    volumes:
      - ../config/env.yaml:/etc/redis-mcp/env.yaml:ro
    command:
      - --transport
      - streamable-http
      - --env-file
      - /etc/redis-mcp/env.yaml
      - --host
      - 0.0.0.0
      - --port
      - "18003"
      - --allowed-host
      - ${REDIS_MCP_ALLOWED_HOST:?请在 .env 中设置 REDIS_MCP_ALLOWED_HOST}
